# Pipeline des prix des carburants sur GitHub Actions.
#
#   - chaque matin (tâche programmée) : ingestion, dbt build, export, publication
#     des fichiers JSON sur GitHub Pages, puis de l'archive des ZIP selon la règle
#     de publier_archive.py ;
#   - à chaque push sur main : le même pipeline, plus la vérification que chaque
#     test singulier détecte son défaut ;
#   - à chaque pull request sur main : le pipeline et la vérification, sans rien
#     publier ;
#   - à la demande (onglet Actions) : comme un push, avec la possibilité de
#     publier l'archive hors dimanche.
#
# Le runner repart de zéro à chaque exécution : ingest.py reconstruit les années
# dont les Parquet manquent (voir PREMIERE_ANNEE), et seuls les ZIP à garder sont
# publiés dans les releases archive-AAAA. Les fichiers JSON sont servis par GitHub
# Pages (https://majin-m.github.io/Carburant/), où la page du portfolio les lit.

name: Pipeline

on:
  schedule:
    # 5 h UTC, soit 6 h ou 7 h à Paris : le fichier contient alors toute la veille.
    - cron: "0 5 * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publier_archive:
        description: "Publier les ZIP du jour même si ce n'est pas dimanche"
        type: boolean
        default: false

# Par défaut, lecture seule ; chaque job demande seulement les droits dont il a besoin.
permissions:
  contents: read

# Deux exécutions ne doivent jamais écrire en même temps dans les releases ni sur Pages.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write          # créer les releases archive-AAAA
    outputs:
      pages_prete: ${{ steps.pages.outcome == 'success' }}

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Installation des dépendances (versions figées)
        run: pip install -r requirements.txt

      - name: Pipeline complet (ingestion, dbt build, export)
        shell: pwsh
        run: ./run.ps1

      - name: Vérification des tests singuliers sur défauts injectés
        if: github.event_name != 'schedule'
        run: python verifier_tests_en_echec.py

      # Préparé seulement si le pipeline et les tests ont réussi : une page n'est
      # jamais publiée avec des données qui n'ont pas passé les tests. Placé avant
      # l'archive : un incident de publication des ZIP ne bloque pas les prix du jour.
      - name: Préparation des fichiers pour GitHub Pages
        id: pages
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: exports/

      - name: Publication de l'archive des ZIP
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python publier_archive.py ${{ inputs.publier_archive && '--forcer' || '' }}

      - name: Fichiers JSON, téléchargeables dans l'onglet Actions
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: exports
          path: exports/
          retention-days: 30

      - name: Journaux, gardés même en cas d'échec
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journaux
          path: |
            logs/
            dbt/logs/
            dbt/target/run_results.json
          retention-days: 30

  publication-pages:
    needs: pipeline
    # Publie dès que les fichiers ont été préparés, même si une étape suivante
    # (publication de l'archive) a échoué : le workflow reste alors en échec.
    if: ${{ !cancelled() && needs.pipeline.outputs.pages_prete == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write             # publier sur GitHub Pages
      id-token: write          # prouver à Pages que la publication vient de ce workflow
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}

    steps:
      - name: Publication sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v4
